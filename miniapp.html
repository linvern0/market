<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0f1419);
    --sec-bg: var(--tg-theme-secondary-bg-color, #17202a);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8b98a5);
    --link: var(--tg-theme-link-color, #4f9eea);
    --button: var(--tg-theme-button-color, #4f46e5);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --accent: #10b981;
    --danger: #ef4444;
    --warn: #f59e0b;
  }
  *{box-sizing:border-box}
  /* TUZATILDI (MUHIM): index.html'da bu qoida bor edi, lekin bu yerda
     (miniapp.html) YO'Q edi. Natijada ba'zi mobil brauzerlar/WebView'lar
     (xususan Telegram ilovasining ichki brauzeri) sahifani tor ekranda
     "o'qish qulay bo'lsin" deb matnni (va shu bilan birga butun
     joylashuvni) AVTOMATIK kattalashtirib yuborardi — foydalanuvchi buni
     "hamma narsa juda katta ko'rinyapti" deb ta'riflagan muammo aynan shu
     edi. Bu qoida shu avtomatik kattalashtirishni o'chiradi. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html{scrollbar-width:thin}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px;-webkit-tap-highlight-color:transparent;letter-spacing:.1px}
  body,.card,.stat-box,.btn,.tab,.pill,.toggle,.chip,input,select,textarea{transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .12s ease,color .2s ease,opacity .2s ease}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:20px}
  .container{padding:12px;animation:mv-fade-in .25s ease}
  @keyframes mv-fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:24px;gap:10px}
  .center-msg .icon{font-size:48px;animation:mv-breathe 2.6s ease-in-out infinite}
  @keyframes mv-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .card{background:var(--sec-bg);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .card:active{transform:scale(.994)}
  .hero{background:linear-gradient(135deg,var(--button),#0d9488 65%,#10302b);border-radius:20px;padding:20px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
  .hero::before{content:'';position:absolute;top:-40%;right:-15%;width:65%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);pointer-events:none}
  .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);background-size:220% 100%;animation:mv-shine 4.5s ease-in-out infinite}
  @keyframes mv-shine{0%{background-position:140% 0}60%,100%{background-position:-60% 0}}
  .hero .label{font-size:13px;opacity:.88;position:relative;display:flex;align-items:center;gap:6px}
  .hero .amount{font-size:30px;font-weight:800;margin-top:3px;position:relative;letter-spacing:-.02em}
  .hero .sub{font-size:12px;opacity:.8;margin-top:5px;position:relative}
  .section-title{font-size:13px;font-weight:700;color:var(--hint);margin:18px 0 9px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .name{font-weight:600;font-size:15px}
  .meta{font-size:12px;color:var(--hint);margin-top:2px}
  .amount-red{color:var(--danger);font-weight:700}
  .amount-green{color:var(--accent);font-weight:700}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(23,32,42,.85);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-top:1px solid rgba(255,255,255,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;z-index:40}
  .tab{flex:1;min-width:56px;text-align:center;padding:8px 2px;border-radius:10px;font-size:10.5px;color:var(--hint);cursor:pointer;position:relative}
  .tab.active{color:var(--button);background:rgba(79,70,229,.14)}
  .tab.active::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--button);box-shadow:0 0 8px var(--button)}
  .tab .ic{font-size:19px;display:block;margin-bottom:2px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .tab.active .ic{transform:translateY(-2px) scale(1.1)}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-box{background:var(--sec-bg);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:13px}
  .stat-box:active{transform:scale(.97)}
  .stat-box .v{font-size:19px;font-weight:800}
  .stat-box .l{font-size:11px;color:var(--hint);margin-top:2px}
  .btn{background:var(--button);color:var(--button-text);border:none;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px -3px rgba(79,70,229,.5)}
  .btn:active{transform:scale(.95);box-shadow:none}
  .btn.small{padding:6px 10px;font-size:12px}
  .btn.wide{width:100%;margin-top:12px;padding:12px}
  .btn.danger{background:var(--danger);box-shadow:0 3px 10px -3px rgba(239,68,68,.5)}
  .btn-outline{background:transparent;border:1px solid var(--button);color:var(--button);box-shadow:none}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
  .pill.low{background:rgba(245,158,11,.15);color:var(--warn)}
  .pill.out{background:rgba(239,68,68,.15);color:var(--danger)}
  .pill.org{background:rgba(79,158,234,.15);color:var(--link)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-end;z-index:50;animation:mv-fade-in-fast .18s ease}
  @keyframes mv-fade-in-fast{from{opacity:0}to{opacity:1}}
  .modal{background:var(--sec-bg);width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow:auto;animation:mv-sheet-up .24s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 -12px 40px rgba(0,0,0,.4)}
  @keyframes mv-sheet-up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  input[type=number],input[type=text],select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:var(--bg);color:var(--text);font-size:15px;margin-top:6px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--button);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
  label.f{display:block;font-size:12px;color:var(--hint);margin-top:10px}
  label.f:first-child{margin-top:0}
  .hidden{display:none!important}
  .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--button);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .switch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .switch-row:last-child{border-bottom:none}
  .toggle{width:44px;height:26px;border-radius:20px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0}
  .toggle.on{background:var(--accent)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .toggle.on .knob{left:21px}
  .qty-ctrl{display:flex;align-items:center;gap:8px}
  .qty-ctrl button{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}
  .qty-ctrl button:active{transform:scale(.9)}
  .cart-bar{position:fixed;bottom:64px;left:0;right:0;background:linear-gradient(135deg,var(--button),#0d9488);color:var(--button-text);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;z-index:20;cursor:pointer;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
  .cart-bar:active{filter:brightness(1.08)}
  .empty{text-align:center;color:var(--hint);padding:22px}
  .chip{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.08);color:var(--hint);margin:2px 4px 2px 0;cursor:pointer;border:1px solid transparent}
  .chip.active{background:var(--button);color:var(--button-text);box-shadow:0 2px 8px -2px rgba(79,70,229,.5)}
  .pill.in{background:rgba(16,185,129,.15);color:var(--accent)}
  /* ---- Tovarlar katalogi gridi — admin panelidagi "Sotish" (#sell-grid)
     bo'limi bilan bir xil rasm-kartochka dizayni: rasm, zaxira belgisi,
     savatdagi son va narx bitta kartada. ---- */
  .catalog-search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--sec-bg);color:var(--text);font-size:14px;margin-bottom:12px}
  .catalog-search:focus{outline:none;border-color:var(--button)}
  .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:460px){.product-grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:720px){.product-grid{grid-template-columns:repeat(4,1fr)}}
  .prod-card{background:var(--sec-bg);border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:pointer}
  .prod-card:active{transform:scale(.96)}
  .prod-card.out{opacity:.55;cursor:default}
  .prod-card .img-wrap{height:96px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .prod-card .img-wrap img{width:100%;height:100%;object-fit:cover}
  .prod-card .img-wrap .no-img{font-size:34px;color:rgba(255,255,255,.22)}
  .prod-card .stock-badge{position:absolute;top:6px;right:6px}
  .prod-card .coin-price-badge{position:absolute;top:32px;right:6px;background:#7c3aed;color:#fff;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;gap:2px}
  .prod-card .cart-badge-overlay{position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .prod-card .body{padding:.55rem .6rem .65rem}
  .prod-card .prod-name{font-weight:700;font-size:12.5px;margin-bottom:.2rem;overflow-wrap:anywhere;line-height:1.25}
  .prod-card .prod-meta{font-size:10.5px;color:var(--hint);margin-bottom:.15rem}
  .prod-card .prod-price{color:var(--accent);font-weight:700;font-size:13.5px;white-space:nowrap}
  .prod-card .prod-points{font-size:10.5px;color:var(--warn);margin-top:.15rem}
  .prod-card .qty-ctrl{margin-top:.4rem;justify-content:space-between}
  .prod-card .qty-ctrl button{width:26px;height:26px;font-size:15px}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>

<div id="loading" class="center-msg"><div class="spinner"></div><div>Yuklanmoqda...</div></div>

<div id="guest" class="center-msg hidden">
  <div class="icon">🔒</div>
  <div style="font-size:16px;font-weight:600">Siz ro'yxatdan o'tmagansiz</div>
  <div id="guest-msg" style="color:var(--hint);font-size:13px;max-width:280px">Botga qaytib <b>/start</b> yozing — avtomatik ravishda mijoz sifatida ro'yxatdan o'tasiz va bu ilovadan foydalana olasiz.</div>
</div>

<div id="app" class="container hidden"></div>

<div id="tabs" class="tabs hidden"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_BASE = location.origin;
let STATE = { data: null, tab: 'main', cart: {} };

function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' '); }
// MUHIM: bu yerda faqat &, <, > va " belgilari escape qilinadi (lekin '
// emas) — chunki bir nechta joyda (masalan onclick="...') ichida) apostrof
// alohida .replace(/'/g,"\\'") orqali JS satri uchun maxsus escape qilinadi;
// agar shu yerda ham '  ni entity'ga aylantirsak, o'sha keyingi escape
// ishlamay qoladi va ism ichida apostrof bo'lgan hollarda (masalan
// "O'ktam" kabi juda keng tarqalgan o'zbekcha ismlar/so'zlar) tugma bosilganda
// JS xatosi chiqadi. " belgisi HTML atributlarni (value="...") buzmasligi
// uchun endi to'g'ri escape qilinadi.
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cs(){ return esc(STATE.data.currencySymbol || "so'm"); }

async function loadData(){
  const initData = tg ? tg.initData : '';
  if (!initData) { showGuest("Bu ilova faqat Telegram ichida ishlaydi."); return; }
  try{
    const res = await fetch(API_BASE + '/api/miniapp-data', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData })
    });
    const data = await res.json();
    if (!data || data.role === 'guest') { showGuest(); return; }
    if (data.ok === false) { showGuest('Xatolik: ' + (data.error||'')); return; }
    STATE.data = data;
    render();
  }catch(e){
    showGuest("Ma'lumot yuklanmadi. Birozdan so'ng qayta urinib ko'ring.");
  }
}

function showGuest(msg){
  document.getElementById('loading').classList.add('hidden');
  const g = document.getElementById('guest');
  g.classList.remove('hidden');
  if (msg) document.getElementById('guest-msg').textContent = msg;
}

function show(el){ document.getElementById(el).classList.remove('hidden'); }
function hide(el){ document.getElementById(el).classList.add('hidden'); }

function render(){
  hide('loading');
  show('app'); show('tabs');
  if (tg && tg.setHeaderColor) try{ tg.setHeaderColor('secondary_bg_color'); }catch(e){}
  // YANGI: ilgari admin shu yerga tushib qolsa, majburan index.html'ga
  // (kompyuter uchun to'liq panel) yo'naltirilardi — endi mini-ilovaning
  // o'zi ham TO'LIQ boshqaruv imkoniyatiga ega (sotish, qarzlar, tovarlar,
  // qarzdorlar, hisobotlar, mijozlar/sodiqlik, xodimlar, sozlamalar), shu
  // sabab admin xohlasa shu yerda — telefondan qulay — ishlashda davom
  // etadi. Kompyuterdagi to'liq panel ("🖥 Boshqaruv panelini ochish"
  // tugmasi) ham alohida taklif etiladi, ikkalasidan xohlaganini tanlaydi.
  if (STATE.data.role === 'admin') { renderAdmin(); return; }
  renderClient();
}

// ================= MIJOZ / QARZDOR KO'RINISHI =================
const CLIENT_TABS_ALL = [['home','🏠','Mening'], ['catalog','🛍','Tovarlar']];
// YANGI: admin "🎛 Mini App bo'limlarini sozlash" oynasidan "catalog"
// (Tovarlar) bo'limini o'chirib qo'yishi mumkin — masalan faqat qarz/coin
// ko'rsatiladigan, savdo katalogisiz mini-ilova kerak bo'lsa.
function clientTabsVisible(d){
  const sec = (d && d.miniAppSections) || {};
  return CLIENT_TABS_ALL.filter(([key])=> key==='home' || sec[key]!==false);
}

function renderClient(){
  const tabsEl = document.getElementById('tabs');
  let active = STATE.clientTab || 'home';
  const visibleTabs = clientTabsVisible(STATE.data);
  if (!visibleTabs.some(([key])=>key===active)) active = 'home';
  tabsEl.innerHTML = visibleTabs.map(([key,ic,label])=>
    `<div class="tab ${active===key?'active':''}" onclick="switchClientTab('${key}')"><span class="ic">${ic}</span>${label}</div>`
  ).join('');
  const app = document.getElementById('app');
  if (active === 'catalog') renderClientCatalog(app, STATE.data);
  else renderDebtor(app, STATE.data);
}
function switchClientTab(t){ STATE.clientTab = t; renderClient(); }

// ---------------- MIJOZ: TOVARLAR KATALOGI ----------------
// Mijoz tovarlar bo'limidagi hamma ma'lumotni (nomi, narxi, hajmi, izohi)
// ko'radi — LEKIN ombordagi mavjud miqdori (stock) hech qachon
// ko'rsatilmaydi, chunki bu faqat administrator uchun ichki ma'lumot.
function renderClientCatalog(app, d){
  STATE.clientCart = STATE.clientCart || {};
  let html = `<div class="section-title">🛍 Tovarlar katalogi</div>
    <input type="text" class="catalog-search" id="catalog-search" placeholder="🔍 Tovar qidirish..." value="${esc(STATE.catalogSearch||'')}" oninput="STATE.catalogSearch=this.value; renderCatalogGrid()">`;
  html += `<div class="product-grid" id="catalog-grid"></div>`;
  app.innerHTML = html;
  renderCatalogGrid();
  renderClientCartBar(d);
  // Qidiruv maydoniga fokus/kursor pozitsiyasini har renderda yo'qotmaslik
  // uchun input alohida — faqat grid qayta chiziladi (pastda).
}
// Faqat gridni qayta chizadi (qidiruv inputini emas) — shunda foydalanuvchi
// yozayotganda input fokusi va kursor joyi yo'qolmaydi.
function renderCatalogGrid(){
  const d = STATE.data;
  const products = d.products || [];
  const q = (STATE.catalogSearch||'').trim().toLowerCase();
  const filtered = q ? products.filter(p=>p.name.toLowerCase().includes(q)) : products;
  const grid = document.getElementById('catalog-grid');
  if (!grid) return;
  if (!products.length){
    grid.outerHTML = `<div class="card empty" id="catalog-grid-empty">Hozircha tovarlar mavjud emas.</div>`;
    return;
  }
  if (!filtered.length){
    grid.innerHTML = '';
    grid.insertAdjacentHTML('afterend', `<div class="card empty" id="catalog-no-match">Hech narsa topilmadi.</div>`);
    return;
  }
  const oldEmpty = document.getElementById('catalog-no-match'); if (oldEmpty) oldEmpty.remove();
  const coinOn = d.coinEnabled !== false; // YANGI: admin coin dasturini o'chirgan bo'lsa, false keladi
  grid.innerHTML = filtered.map(p=>{
    const qty = STATE.clientCart[p.id] || 0;
    const out = p.inStock === false;
    const cartBadge = qty>0 ? `<div class="cart-badge-overlay">${qty}</div>` : '';
    // YANGI: "coinCost" — bu tovarni FAQAT COIN evaziga (naqd pulsiz)
    // sotib olish uchun kerakli coin miqdori. Admin tovar tahrirlashda
    // alohida belgilagan bo'lishi mumkin; aks holda narx/umumiy sozlamadan
    // (d.settings.coinSettings) avtomatik hisoblanadi.
    const coinCost = getProductCoinCostClient(p, d);
    return `<div class="prod-card ${out?'out':''}" data-id="${p.id}" onclick="clientCardTap(event,'${p.id}')">
      <div class="img-wrap">
        ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="no-img" style="${p.img?'display:none':''}">💧</div>
        <div class="stock-badge"><span class="pill ${out?'out':'in'}">${out?'Tugagan':'Mavjud'}</span></div>
        ${out ? '' : (coinOn ? `<div class="coin-price-badge">🪙 ${coinCost}</div>` : '')}
        ${cartBadge}
      </div>
      <div class="body">
        <div class="prod-name">${esc(p.name)}</div>
        ${p.volume ? `<div class="prod-meta">📦 ${esc(p.volume)}</div>` : ''}
        <div class="prod-price">${fmt(p.price)} ${cs()}</div>
        ${(coinOn && p.points>0) ? `<div class="prod-points">🪙 +${p.points} coin</div>` : ''}
        ${out ? '' : `<div class="qty-ctrl" onclick="event.stopPropagation()">
          <button onclick="changeClientCartQty('${p.id}',-1)">−</button>
          <span style="min-width:16px;text-align:center">${qty}</span>
          <button onclick="changeClientCartQty('${p.id}',1)">+</button>
        </div>`}
        ${(out || !coinOn) ? '' : `<button class="btn small btn-outline" style="width:100%;margin-top:6px" onclick="event.stopPropagation();buyWithCoin('${p.id}',${coinCost})">🪙 Coinga sotib olish</button>`}
      </div>
    </div>`;
  }).join('');
}
// Umumiy sozlamadan (yoki tovarga alohida belgilangan qiymatdan) coin
// narxini hisoblaydi — index.html/api tarafidagi mantiq bilan bir xil.
function getProductCoinCostClient(p, d){
  if (p && Number(p.coinCost) > 0) return Math.round(Number(p.coinCost));
  const cs = (d && d.coinSettings) || (d && d.settings && d.settings.coinSettings) || {};
  const redeemValuePerCoin = Number(cs.redeemValuePerCoin) > 0 ? Number(cs.redeemValuePerCoin) : 100;
  return Math.max(1, Math.ceil((p && p.price || 0) / redeemValuePerCoin));
}
// YANGI: mijoz bitta tovarni TO'LIQ coin evaziga (naqd pulsiz) sotib olish
// so'rovini yuboradi. Coin yetarli bo'lsa, admin botdan Tasdiqlash/Bekor
// qilish tugmasi bilan qaror qabul qiladi.
function buyWithCoin(productId, coinCost){
  const d = STATE.data;
  const p = (d.products||[]).find(x=>x.id===productId);
  if (!p) return;
  const myCoins = (d.loyalty && d.loyalty.points) || 0;
  if (myCoins < coinCost){
    toastMsg(`🪙 Coin yetarli emas (kerak: ${coinCost}, sizda: ${myCoins})`);
    return;
  }
  confirm2("🪙 Coinga sotib olish", `"${p.name}" ni ${coinCost} coinga sotib olish so'rovini yuborasizmi? Admin tasdiqlashi bilan tovar sizga beriladi va coiningizdan ${coinCost} ta ayiriladi.`, async ()=>{
    const r = await callAction('create_coin_order', { productId, qty: 1 });
    if (r.ok){
      if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
      toastMsg("✅ So'rov yuborildi — admin tasdiqlashini kuting");
    } else {
      const msg = r.error==='not_enough_stock' ? "Omborda yetarli emas"
        : r.error==='not_enough_coins' ? `Coin yetarli emas (kerak: ${r.need}, sizda: ${r.have})`
        : r.error==='not_registered' ? "Avval sodiqlik dasturiga ro'yxatdan o'ting"
        : ('Xatolik: ' + (r.error||''));
      toastMsg(msg);
    }
  });
}
// Kartaning rasm/nom qismiga bosilganda — admin panelidagi "Sotish" gridi
// kabi — bitta dona darhol savatga qo'shiladi (miqdor tugmalari esa
// alohida, event.stopPropagation bilan himoyalangan).
function clientCardTap(e, id){
  const p = (STATE.data.products||[]).find(x=>x.id===id);
  if (!p || p.inStock===false) return;
  changeClientCartQty(id, 1);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
function changeClientCartQty(id, delta){
  STATE.clientCart = STATE.clientCart || {};
  const cur = STATE.clientCart[id] || 0;
  let next = cur + delta;
  if (next < 0) next = 0;
  if (next === 0) delete STATE.clientCart[id]; else STATE.clientCart[id] = next;
  renderCatalogGrid();
  renderClientCartBar(STATE.data);
}
function clientCartTotal(){
  const d = STATE.data;
  return Object.entries(STATE.clientCart||{}).reduce((a,[id,qty])=>{ const p=(d.products||[]).find(x=>x.id===id); return a + (p?p.price*qty:0); },0);
}
function renderClientCartBar(d){
  let bar = document.getElementById('cart-bar');
  const count = Object.values(STATE.clientCart||{}).reduce((a,b)=>a+b,0);
  if (bar) bar.remove();
  if (!count) return;
  bar = document.createElement('div');
  bar.id = 'cart-bar'; bar.className = 'cart-bar';
  bar.onclick = openClientCheckoutModal;
  bar.innerHTML = `<span>🛒 ${count} ta tovar</span><span>${fmt(clientCartTotal())} ${cs()} →</span>`;
  document.body.appendChild(bar);
}
function openClientCheckoutModal(){
  const d = STATE.data;
  const total = clientCartTotal();
  const myPoints = (d.loyalty && d.loyalty.points) || 0;
  // TUZATILDI: ilgira bu yerda "1 coin = 100 so'm" matni qattiq yozilgan
  // edi — admin sozlamalarda coin qiymatini o'zgartirsa, mijozga bu yerda
  // hamon eski (noto'g'ri) qiymat ko'rsatilardi. Endi haqiqiy
  // (d.coinSettings.redeemValuePerCoin) qiymatdan foydalanadi.
  const cSet = d.coinSettings || {};
  const redeemValuePerCoin = Number(cSet.redeemValuePerCoin) > 0 ? Number(cSet.redeemValuePerCoin) : 100;
  const canUsePoints = (d.coinEnabled !== false) && myPoints >= 100; // kamida 100 coin to'plangach foydalanish mumkin, coin o'chirilgan bo'lsa hech qachon
  showModal(`
    <div style="font-weight:700;font-size:16px;margin-bottom:10px">Buyurtma — ${fmt(total)} ${cs()}</div>
    <div class="card" style="font-size:12.5px;color:var(--hint)">✅ Buyurtma yuborilgach, do'kon administratori tasdiqlaydi — shundan so'ng tovar sizga rasmiylashtiriladi.</div>
    <div class="chip active" id="pay-cash" onclick="setClientPayMode(false)">💵 Naqd pul</div>
    <div class="chip ${canUsePoints?'':'hidden'}" id="pay-points" onclick="setClientPayMode(true)">🪙 Coinlarim (${myPoints} coin bor)</div>
    <div id="pay-points-info" class="hidden" style="margin-top:8px;font-size:12.5px;color:var(--hint)">1 coin = ${fmt(redeemValuePerCoin)} ${cs()} chegirma sifatida hisoblanadi. Coiningiz yetmasa, qolgan qismini naqd to'laysiz.</div>
    <button class="btn wide" onclick="submitClientOrder()">✅ Buyurtma berish</button>
  `);
}
function setClientPayMode(usePoints){
  document.getElementById('pay-cash').classList.toggle('active', !usePoints);
  const pp = document.getElementById('pay-points');
  if (pp) pp.classList.toggle('active', usePoints);
  document.getElementById('pay-points-info').classList.toggle('hidden', !usePoints);
  STATE.clientUsePoints = usePoints;
}
async function submitClientOrder(){
  const items = Object.entries(STATE.clientCart||{}).map(([productId,qty])=>({productId,qty}));
  if (!items.length){ toast('Savat bo\'sh.'); return; }
  const r = await callAction('create_order', { items, usePoints: !!STATE.clientUsePoints });
  closeModal();
  if (r.ok){
    if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    STATE.clientCart = {}; STATE.clientUsePoints = false;
    toastMsg('✅ Buyurtma yuborildi — admin tasdig\'ini kuting');
    await loadData();
    STATE.clientTab = 'catalog'; renderClient();
  } else {
    toast('Xatolik: ' + (r.error||'') + (r.productName?(' — '+r.productName):''));
  }
}

          <div class="${x.paid?'amount-green':'amount-red'}">${x.paid ? "✅ To'langan" : fmt(x.remaining) + ' ' + cs()}</div>
        </div>
        ${x.items && x.items.length ? `<div style="margin-top:8px;font-size:12.5px;color:var(--hint)">${x.items.map(it=>`• ${esc(it.name)} — ${it.qty} ta × ${fmt(it.price)} ${cs()}`).join('<br>')}</div>` : ''}

const ADMIN_TABS_ALL = [
  ['main','📊','Bosh'], ['sell','🛒','Sotish'], ['debts','📋','Qarzlar'],
  ['stock','📦','Tovarlar'], ['debtors','👥','Qarzdorlar'], ['report','📈','Hisobot'],
  ['customers','🪙','Mijozlar'], ['staff','🧑\u200d💼','Xodimlar'], ['settings','⚙️','Sozlama'],
];
// YANGI: admin "🎛 Mini App bo'limlarini sozlash" oynasidan boshqa
// adminlar/xodimlar uchun ochiladigan Mini App'da qaysi bo'limlar
// (tab'lar) ko'rinishini belgilaydi. 'main' (Bosh) doim ko'rinadi.
function adminTabsVisible(d){
  const sec = (d && d.settings && d.settings.miniAppSections) || {};
  return ADMIN_TABS_ALL.filter(([key])=> key==='main' || sec[key]!==false);
}

function renderAdmin(){
  const tabsEl = document.getElementById('tabs');
  const visibleTabs = adminTabsVisible(STATE.data);
  if (!visibleTabs.some(([key])=>key===STATE.tab)) STATE.tab = 'main';
  tabsEl.innerHTML = visibleTabs.map(([key,ic,label])=>
    `<div class="tab ${STATE.tab===key?'active':''}" onclick="switchTab('${key}')"><span class="ic">${ic}</span>${label}</div>`
  ).join('');
  const app = document.getElementById('app');
  const d = STATE.data;

  if (STATE.tab === 'main') renderMain(app, d);
  if (STATE.tab === 'sell') renderSell(app, d);
  if (STATE.tab === 'debts') renderDebts(app, d);
  if (STATE.tab === 'stock') renderStock(app, d);
  if (STATE.tab === 'debtors') renderDebtorsTab(app, d);
  if (STATE.tab === 'report') renderReport(app, d);
  if (STATE.tab === 'customers') renderCustomers(app, d);
  if (STATE.tab === 'staff') renderStaff(app, d);
  if (STATE.tab === 'settings') renderSettings(app, d);
}

function switchTab(t){ STATE.tab = t; renderAdmin(); }

function renderMain(app, d){
  app.innerHTML = `
    <div class="hero"><div class="label">${esc(d.shopName)}</div><div class="amount">${fmt(d.stats.revenue)} ${cs()}</div><div class="sub">Bugungi tushum</div></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="v">${d.stats.salesCount}</div><div class="l">Bugungi savdolar</div></div>
      <div class="stat-box"><div class="v">${fmt(d.stats.profit)}</div><div class="l">Bugungi foyda</div></div>
      <div class="stat-box"><div class="v" style="color:var(--danger)">${fmt(d.totalDebt)}</div><div class="l">Jami faol qarz</div></div>
      <div class="stat-box"><div class="v" style="color:var(--warn)">${d.stock.low.length + d.stock.out.length}</div><div class="l">Ombordagi ogohlantirish</div></div>
    </div>
    <div class="section-title">Oxirgi 7 kun — savdo</div>
    <div class="card">${renderWeekChart(d.last7Days||[])}</div>`;
}
function renderWeekChart(days){
  if (!days.length) return '<div class="empty">Ma\'lumot yo\'q</div>';
  const max = Math.max(1, ...days.map(x=>x.revenue));
  const w = 300, h = 120, barW = w/days.length - 8;
  let bars = '';
  days.forEach((x,i)=>{
    const bh = Math.max(2, (x.revenue/max)*(h-24));
    const bx = i*(w/days.length) + 4;
    const by = h - bh - 18;
    bars += `<rect x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="3" fill="var(--button)"></rect>
      <text x="${bx+barW/2}" y="${h-4}" font-size="8" fill="var(--hint)" text-anchor="middle">${x.date.slice(5)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">${bars}</svg>
    <div style="text-align:center;font-size:11px;color:var(--hint);margin-top:4px">Kunlik tushum (${fmt(max)} ${cs()} — eng yuqori kun)</div>`;
}

// Boshqaruv panelidagi (index.html) "Sotish" bo'limi (#sell-grid) bilan BIR
// XIL rasm-kartochka dizayni: rasm, zaxira miqdori belgisi, savatdagi son
// va narx bitta kartada, ustida qidiruv maydoni. Ilgari bu yerda faqat
// oddiy matnli ro'yxat bo'lgan — endi mijoz katalogidagi bilan bir xil
// vizual uslub ishlatiladi (pastdagi CSS ham umumiy: .product-grid, .prod-card).
function renderSell(app, d){
  let html = `<div class="section-title">Tovar tanlang</div>
    <input type="text" class="catalog-search" id="sell-search" placeholder="🔍 Tovar qidirish..." value="${esc(STATE.sellSearch||'')}" oninput="STATE.sellSearch=this.value; renderSellGrid()">`;
  html += `<div class="product-grid" id="sell-grid-mini"></div>`;
  app.innerHTML = html;
  renderSellGrid();
  renderCartBar(d);
}
// Faqat gridni qayta chizadi (qidiruv inputini emas) — foydalanuvchi
// yozayotganda input fokusi/kursor joyi yo'qolmasligi uchun (katalogdagi
// bilan bir xil mantiq).
function renderSellGrid(){
  const d = STATE.data;
  const products = d.products || [];
  const q = (STATE.sellSearch||'').trim().toLowerCase();
  const filtered = q ? products.filter(p=>p.name.toLowerCase().includes(q)) : products;
  const grid = document.getElementById('sell-grid-mini');
  if (!grid) return;
  if (!products.length){
    grid.outerHTML = `<div class="card empty" id="sell-grid-empty">Tovarlar yo'q. "Tovarlar" bo'limidan qo'shing.</div>`;
    return;
  }
  if (!filtered.length){
    grid.innerHTML = '';
    grid.insertAdjacentHTML('afterend', `<div class="card empty" id="sell-no-match">Hech narsa topilmadi.</div>`);
    return;
  }
  const oldEmpty = document.getElementById('sell-no-match'); if (oldEmpty) oldEmpty.remove();
  const lowStockThreshold = d.lowStockThreshold || 5;
  grid.innerHTML = filtered.map(p=>{
    const qty = STATE.cart[p.id] || 0;
    const out = p.stock === 0;
    const low = !out && p.stock <= lowStockThreshold;
    const cartBadge = qty>0 ? `<div class="cart-badge-overlay">${qty}</div>` : '';
    return `<div class="prod-card ${out?'out':''}" data-id="${p.id}" onclick="sellCardTap(event,'${p.id}')">
      <div class="img-wrap">
        ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="no-img" style="${p.img?'display:none':''}">💧</div>
        <div class="stock-badge"><span class="pill ${out?'out':low?'low':'in'}">${p.stock} ta</span></div>
        ${cartBadge}
      </div>
      <div class="body">
        <div class="prod-name">${esc(p.name)}</div>
        ${p.volume ? `<div class="prod-meta">📦 ${esc(p.volume)}</div>` : ''}
        <div class="prod-price">${fmt(p.price)} ${cs()}</div>
        ${out ? '' : `<div class="qty-ctrl" onclick="event.stopPropagation()">
          <button onclick="changeCartQty('${p.id}',-1)">−</button>
          <span style="min-width:16px;text-align:center">${qty}</span>
          <button onclick="changeCartQty('${p.id}',1)">+</button>
        </div>`}
      </div>
    </div>`;
  }).join('');
}
// Kartaning rasm/nom qismiga bosilganda — katalogdagi bilan bir xil — bitta
// dona darhol savatga qo'shiladi (miqdor tugmalari alohida, event.stopPropagation bilan himoyalangan).
function sellCardTap(e, id){
  const d = STATE.data;
  const p = (d.products||[]).find(x=>x.id===id);
  if (!p || p.stock===0) return;
  changeCartQty(id, 1);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
function changeCartQty(id, delta){
  const d = STATE.data;
  const p = d.products.find(x=>x.id===id);
  if (!p) return;
  const cur = STATE.cart[id] || 0;
  let next = cur + delta;
  if (next < 0) next = 0;
  if (next > p.stock) { if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); next = p.stock; }
  if (next === 0) delete STATE.cart[id]; else STATE.cart[id] = next;
  renderSellGrid();
  renderCartBar(d);
}
function cartTotal(){
  const d = STATE.data;
  return Object.entries(STATE.cart).reduce((a,[id,qty])=>{ const p=d.products.find(x=>x.id===id); return a + (p?p.price*qty:0); },0);
}
function renderCartBar(d){
  let bar = document.getElementById('cart-bar');
  const count = Object.values(STATE.cart).reduce((a,b)=>a+b,0);
  if (bar) bar.remove();
  if (!count) return;
  bar = document.createElement('div');
  bar.id = 'cart-bar'; bar.className = 'cart-bar';
  bar.onclick = openCartReviewModal;
  bar.innerHTML = `<span>🛒 ${count} ta tovar</span><span>${fmt(cartTotal())} ${cs()} →</span>`;
  document.body.appendChild(bar);
}
// YANGI: savatni yakunlashdan oldin ko'rib chiqish oynasi — web-paneldagi
// ("index.html") "modal-cart" bilan BIR XIL: har bir tovar alohida qatorda,
// miqdorini shu yerdan ham o'zgartirish/olib tashlash mumkin.
function openCartReviewModal(){
  const d = STATE.data;
  const items = Object.entries(STATE.cart);
  if (!items.length) return;
  let rows = items.map(([id,qty])=>{
    const pr = d.products.find(x=>x.id===id);
    if (!pr) return '';
    return `<div class="card row" style="padding:8px 10px">
      <div style="min-width:0"><div class="name" style="font-size:13.5px">${esc(pr.name)}</div><div class="meta">${fmt(pr.price)} ${cs()} × ${qty} = ${fmt(pr.price*qty)} ${cs()}</div></div>
      <div class="qty-ctrl" style="flex:0 0 auto">
        <button onclick="reviewChangeQty('${id}',-1)">−</button>
        <span style="min-width:16px;text-align:center">${qty}</span>
        <button onclick="reviewChangeQty('${id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
  showModal(`
    <div style="font-weight:700;font-size:16px;margin-bottom:10px">🛒 Savat</div>
    <div id="cart-review-items">${rows}</div>
    <div class="row" style="margin-top:10px;font-weight:700"><span>Jami:</span><span id="cart-review-total" class="amount-green">${fmt(cartTotal())} ${cs()}</span></div>
    <button class="btn wide" style="margin-top:12px" onclick="proceedToCheckout()">Davom etish →</button>
  `);
}
function reviewChangeQty(id, delta){
  changeCartQty(id, delta);
  const items = Object.entries(STATE.cart);
  if (!items.length){ closeModal(); return; }
  openCartReviewModal();
}
function proceedToCheckout(){
  closeModal();
  openCheckoutModal();
}

function setSellMode(mode){

  document.getElementById('debt-fields').classList.toggle('hidden', mode!=='debt');

// ---------------- EXCEL (CSV) EKSPORT ----------------
function exportDebtsCsv(){
  const d = STATE.data;
  const rows = [['Ism','Tashkilot','Summa','Qoldiq','Sana','Muddat','Izoh']];
  d.debts.forEach(x=>{
    rows.push([x.name, x.org||'', x.total, x.remaining, new Date(x.date).toLocaleDateString('uz-UZ'), x.dueDate?new Date(x.dueDate).toLocaleDateString('uz-UZ'):'', x.note||'']);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `qarzlar_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function remindDebtor(debtorId){
  const r = await callAction('send_debt_reminder', { debtorId });
  if (r.ok){ if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); toastMsg('Eslatma yuborildi ✅'); }
  else toast('Yuborib bo\'lmadi: ' + (r.error==='not_linked' ? 'bu odam botga hali ulanmagan' : r.error||''));
}
function toastMsg(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--sec-bg);color:var(--text);padding:8px 16px;border-radius:20px;font-size:13px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.3)';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function loadMiniImgFile(input){
  const file = input.files[0]; if (!file) return;

    document.getElementById('pf-img').value = '';

    document.getElementById('pf-img-preview-wrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

  let html = `<div class="section-title">Hisobot</div>
    <div class="card" style="display:flex;gap:6px;padding:8px">
      ${['today','week','month'].map(k=>`<button class="btn small ${per===k?'':'btn-outline'}" style="flex:1" onclick="setReportPeriod('${k}')">${ {today:'Kun',week:'Hafta',month:'Oy'}[k] }</button>`).join('')}
    </div>

      <div class="label">💰 ${periodLabel} — tushum</div>
      <div class="amount">${fmt(stat.revenue)} ${cs()}</div>
      ${changeLine}
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="v">${fmt(stat.profit)}</div><div class="l">Foyda</div></div>
      <div class="stat-box"><div class="v">${stat.salesCount}</div><div class="l">Savdolar soni</div></div>
      <div class="stat-box"><div class="v">${stat.salesCount ? fmt(Math.round(stat.revenue/stat.salesCount)) : 0}</div><div class="l">O'rtacha chek</div></div>
      <div class="stat-box"><div class="v" style="color:var(--danger)">${fmt(stat.newDebt)}</div><div class="l">Yangi qarzga sotildi</div></div>
    </div>
    <div class="section-title">Oxirgi 7 kun — savdo</div>
    <div class="card">${renderWeekChart(d.last7Days||[])}</div>
    <div class="section-title">🏆 Eng ko'p sotilgan tovarlar (${periodLabel.toLowerCase()})</div>`;
  const top = (r.topProducts && r.topProducts[per]) || [];
  if (!top.length){ html += `<div class="card empty">Ma'lumot yo'q</div>`; }
  else {
    const medals = ['🥇','🥈','🥉'];
    top.forEach((p,i)=>{
      html += `<div class="card row"><div class="name">${medals[i]||(i+1)+'.'} ${esc(p.name)}</div><div style="text-align:right"><div class="amount-green">${fmt(p.revenue)} ${cs()}</div><div class="meta">${p.qty} dona sotildi</div></div></div>`;
    });
  }
  html += `<div class="section-title">🧾 So'nggi savdolar</div>`;
  // YANGI: web-paneldagi ("index.html" — "Mening sotuvlarim"/"Savdo tarixi")
  // bilan BIR XIL — bitta xariddagi (receiptId) barcha qatorlar bitta
  // kartaga birlashtiriladi va "↩ Qaytarish" tugmasi qo'shiladi (faqat
  // sozlamalardagi revertMinutes oynasi ichida).
  const recent = groupSalesByReceipt(r.recentSales || []);
  if (!recent.length){ html += `<div class="card empty">Hali savdo yo'q</div>`; }
  else {
    const revertMins = d.revertMinutes || 30;
    const now = Date.now();
    recent.forEach(g=>{
      const itemsLabel = g.items.length===1 ? esc(g.items[0].productName) : g.items.map(it=>`${it.qty}x ${esc(it.productName)}`).join(', ');
      const t = new Date(g.date).getTime();
      const canRevert = !isNaN(t) && (now - t)/60000 <= revertMins;
      html += `<div class="card">
        <div class="row" style="align-items:flex-start">
          <div><div class="name">${itemsLabel} ${g.isDebt?'<span class="pill org">nasiya</span>':''}</div><div class="meta">${new Date(g.date).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${g.qty} ta · ${esc(g.seller||'')}</div></div>
          <div class="amount-green">${fmt(g.total)} ${cs()}</div>
        </div>
        ${canRevert ? `<div style="margin-top:8px;text-align:right"><button class="btn small btn-outline" style="color:var(--warn);border-color:var(--warn)" onclick="revertSale('${g.receiptId}')">↩ Qaytarish (bekor qilish)</button></div>` : ''}
      </div>`;
    });
  }
  html += `<div class="card" style="text-align:center"><button class="btn small btn-outline" onclick="exportReportCsv()">📤 Excel'ga eksport</button></div>`;
  app.innerHTML = html;
}
// Bir xil receiptId'ga ega savdo qatorlarini bitta xarid guruhiga
// birlashtiradi — web-paneldagi groupSalesByReceipt bilan bir xil mantiq.
function groupSalesByReceipt(sales){
  const map = new Map();
  const order = [];
  sales.forEach(s=>{
    const key = s.receiptId || s.id;
    if (!map.has(key)){
      map.set(key, { receiptId:key, date:s.date, seller:s.seller, isDebt:s.isDebt, qty:0, total:0, items:[] });
      order.push(key);
    }
    const g = map.get(key);
    g.qty += (s.qty||0);
    g.total += (s.total||0);
    g.items.push({ productName:s.productName, qty:s.qty });
  });
  return order.map(k=>map.get(k));
}
function revertSale(receiptId){
  confirm2("Savdoni qaytarish", "Ushbu xarid bekor qilinsin va tovar omborga qaytarilsinmi?", async ()=>{
    const r = await callAction('revert_sale', { receiptId });
    if (r.ok){
      if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
      await loadData(); STATE.tab='report'; renderAdmin();
    } else {
      const msgs = { revert_window_expired: "Qaytarish uchun berilgan vaqt tugagan.", sale_not_found: "Savdo topilmadi yoki allaqachon qaytarilgan.", not_admin: "Bu amal faqat admin uchun." };
      toast('Xatolik: ' + (msgs[r.error] || r.error || ''));
    }
  });
}
function setReportPeriod(p){ STATE.reportPeriod = p; renderAdmin(); }
function exportReportCsv(){
  const r = (STATE.data.report && STATE.data.report.recentSales) || [];
  const rows = [['Sana','Tovar','Miqdor','Narx','Summa','Sotuvchi','Turi']];
  r.forEach(s=>rows.push([new Date(s.date).toLocaleString('uz-UZ'), s.productName, s.qty, s.price, s.total, s.seller||'', s.isDebt?'Nasiya':'Naqd']));
  const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `hisobot_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// TUZATILDI: darajalar (Bronza/Kumush/Oltin va h.k.) va ularning necha
// so'mdan boshlanishi ilgari shu yerda ham QATTIQ yozilgan edi (500,000 /
// 2,000,000) va index.html'dagi ("🏆 Darajalarni sozlash") admin
// sozlamalaridan MUTLAQO XABARSIZ edi. Endi ikkalasi ham BIR XIL manbadan
// (Firebase'dagi dokon/settings > loyaltyTiers, shu yerga d.settings.loyaltyTiers
// orqali keladi) o'qiydi — admin qaysi interfeysdan sozlasa ham, ikkala
// joyda ham bir xil darajalar ko'rinadi.
function getLoyaltyTiers(d){
  const tiers = (d && d.settings && Array.isArray(d.settings.loyaltyTiers) && d.settings.loyaltyTiers.length)
    ? d.settings.loyaltyTiers
    : [{id:'bronze',name:'Bronza',emoji:'🥉',threshold:0,color:'#16a34a'},{id:'silver',name:'Kumush',emoji:'🥈',threshold:500000,color:'#2563eb'},{id:'gold',name:'Oltin',emoji:'🥇',threshold:2000000,color:'#d97706'}];
  return tiers.slice().sort((a,b)=>(a.threshold||0)-(b.threshold||0));
}
function customerTierLabel(c, tiers){
  if(c.tierOverride){
    const f = tiers.find(t=>t.id===c.tierOverride);
    if(f) return `${f.emoji||''} ${f.name||''}`.trim();
  }
  let cur = tiers[0];
  for(const t of tiers){ if((c.totalSpent||0) >= (t.threshold||0)) cur = t; }
  return `${cur.emoji||''} ${cur.name||''}`.trim();
}
function renderCustomers(app, d){

  const list = [...(d.customers||[])].sort((a,b)=>(b.totalSpent||0)-(a.totalSpent||0));

  if (!name || (!username && !phone)){ toast('Ism va (username yoki telefon) kiriting.'); return; }
  const r = await callAction('upsert_admin', { name, username, phone });
  closeModal();
  if (r.ok){ await loadData(); STATE.tab='settings'; renderAdmin(); } else toast('Xatolik: ' + (r.error||''));
}
function removeAdmin(chatId, username, phone, name){
  confirm2("Adminni o'chirish", `"${name}" adminlikdan o'chirilsinmi?`, async ()=>{
    const r = await callAction('remove_admin', { chatId, username, phone });
    if (r.ok){ await loadData(); STATE.tab='settings'; renderAdmin(); }
    else toast(r.error==='cannot_remove_self' ? "O'zingizni o'chira olmaysiz." : ('Xatolik: ' + (r.error||'')));
  });
}

// ---------------- MODALLAR (umumiy) / TO'LOV ----------------
function openPayModal(debtId, name, remaining){
  showModal(`
    <div style="font-weight:700;font-size:16px;margin-bottom:4px">${esc(name)}</div>
    <div style="color:var(--hint);font-size:13px;margin-bottom:10px">Qoldiq: ${fmt(remaining)}</div>
    <input type="number" id="pay-amount" placeholder="Summa" value="${remaining}">
    <button class="btn wide" onclick="submitPay('${debtId}')">To'lovni saqlash</button>
  `);
}
function showModal(inner){
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modal-bg';
  bg.onclick = (e)=>{ if(e.target.id==='modal-bg') closeModal(); };
  bg.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){ const m = document.getElementById('modal-bg'); if(m) m.remove(); }
// YANGI: native toast()ning o'rnini bosuvchi bildirishnoma. SABAB: xuddi
// confirm()/prompt() kabi, native toast() ham ba'zi Telegram klient/qurilma
// birikmalarida butun WebView'ni bloklab qo'yishi yoki umuman chiqmasligi
// mumkin. Bu oddiy, o'zi yopiladigan bildirishnoma esa har doim bir xil
// ishonchli ko'rinadi va foydalanuvchi tajribasini yaxshilaydi.
let _toastTimer2 = null;
function toast(msg, type){
  let el = document.getElementById('toast2-el');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast2-el';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(0);' +
      'max-width:88vw;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;' +
      'color:#fff;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;' +
      'transition:opacity .18s,transform .18s;pointer-events:none;text-align:center';
    document.body.appendChild(el);
  }
  const colors = { red:'#e0473e', green:'#2fa86a', amber:'#d99a2b' };
  el.style.background = colors[type] || colors.red;
  el.textContent = msg;
  clearTimeout(_toastTimer2);
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(-4px)'; });
  _toastTimer2 = setTimeout(()=>{
    el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(0)';
  }, 2600);
}
// YANGI: native confirm()ning o'rnini bosuvchi oyna. SABAB: Telegram Mini
// App ichida brauzerning confirm()/prompt() funksiyalari ko'p qurilma va
// Telegram versiyalarida ishonchli ishlamaydi — tugma bosilganda hech
// qanday oyna chiqmasligi mumkin. Shu sabab "O'chirish" kabi amallar
// ba'zan "hech narsa bo'lmayapti"day tuyulardi. Bu oyna esa oddiy modal
// bo'lgani uchun har doim bir xil ishonchli ishlaydi.
function confirm2(title, msg, onYes){
  showModal(`
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">${esc(title)}</div>
    <div style="color:var(--hint);font-size:13px;margin-bottom:14px">${esc(msg)}</div>
    <div style="display:flex;gap:8px">
      <button class="btn wide btn-outline" onclick="closeModal()">Yo'q</button>
      <button class="btn wide danger" id="confirm2-yes-btn">Ha, davom etish</button>
    </div>
  `);
  const btn = document.getElementById('confirm2-yes-btn');
  if(btn) btn.onclick = ()=>{ closeModal(); onYes(); };
}
function openDesktopPanel(){
  const url = window.location.href.replace(/miniapp\.html([^/]*)$/, 'index.html');
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
}

// TUZATILDI — IKKI MARTA BOSISH / QAYTA YUBORISH XATOSI: ilgari har bir
// callAction() chaqiruvi hech qanday tekshiruvsiz darhol yangi tarmoq
// so'rovi yuborardi. Sekin internetda yoki mobil ekranda tugmani ikki
// marta bossa (masalan "Saqlash"), IKKI XIL so'rov ketardi va backend
// amalni (masalan coin qo'shish) IKKI MARTA bajarardi — natijada 500
// coin o'rniga 1000 coin yozilib qolgan holatlar shundan kelib chiqqan.
// Endi: bir xil action+payload bilan so'rov hali javob kutayotgan bo'lsa,
// YANGI tarmoq so'rovi yuborilmaydi — o'sha DAVOM ETAYOTGAN so'rovning
// natijasi qaytariladi.
const _pendingActionCalls = {};
async function callAction(action, payload){
  const sig = action + '::' + JSON.stringify(payload || {});
  if (_pendingActionCalls[sig]) {
    // Bu aynan shu amal allaqachon serverga yuborilgan va javob kutilmoqda —
    // qayta yubormasdan o'sha so'rovning natijasini qaytaramiz.
    return _pendingActionCalls[sig];
  }
  const initData = tg ? tg.initData : '';
  const promise = fetch(API_BASE + '/api/miniapp-action', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData, action, payload })
  }).then(res => res.json()).finally(() => {
    delete _pendingActionCalls[sig];
  });
  _pendingActionCalls[sig] = promise;
  return promise;
}

async function submitPay(debtId){
  const amount = document.getElementById('pay-amount').value;
  const r = await callAction('pay_debt', { debtId, amount });
  closeModal();
  if (r.ok){ if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); await loadData(); STATE.tab='debts'; renderAdmin(); }
  else toast('Xatolik: ' + (r.error||''));
}

loadData();
</script>
